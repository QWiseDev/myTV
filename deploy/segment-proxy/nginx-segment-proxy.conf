# 独立分片代理的 HTTPS 入口：新端口 + IP 证书（无 SNI，IP 直连场景一端口一站点）
# 放置为 /etc/nginx/conf.d/segment-proxy-ip.conf
server {
    listen 9447 ssl;
    server_name 124.220.134.40;

    ssl_certificate /etc/letsencrypt/live/124.220.134.40/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/124.220.134.40/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 分片为流式转发，关闭缓冲避免 nginx 攒满缓冲区才下发
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8100;
    }
}
